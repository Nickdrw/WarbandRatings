name: CI

on:
  push:
    tags:
      - "v*"
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 and Luacheck
        run: sudo apt-get install -y lua5.1 lua-check
      - name: Run tests
        run: |
          set -e
          for test_file in tests/test_*.lua; do
            lua5.1 "$test_file"
          done
      - name: Lint Lua
        run: luacheck .

  # Runs on tags only - release
  package-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        with:
          args: -g retail
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
